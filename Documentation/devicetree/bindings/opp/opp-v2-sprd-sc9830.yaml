%YAML 1.2
---
$id: http://devicetree.org/schemas/opp/opp-v2-sprd-sc9830.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 calibrated CPU operating points

maintainers:
  - minorum <mit.mis@gmail.com>

description: |
  The shared Cortex-A7 cluster uses nominal operating-point voltages with
  request-dependent SC2723 factory compensation. The calibration code is
  centered at 64 and adjusted by 32 times the additional code minus one.
  The resulting signed delta scales by nominal millivolts divided by 900,
  truncating toward zero, then by 3125 microvolts. This offset is added to
  the nominal voltage before programming the raw CPU supply selector.

allOf:
  - $ref: opp-v2-base.yaml#

properties:
  compatible:
    const: operating-points-v2-sprd-sc9830

  opp-shared: true

  nvmem-cells:
    items:
      - description: Calibration validity bit 7, must be clear
      - description: CPU calibration bits 14 through 20
      - description: Additional CPU calibration bits 254 through 255

  nvmem-cell-names:
    items:
      - const: calibration_state
      - const: vddarm
      - const: additional

patternProperties:
  '^opp-[0-9]+$':
    type: object
    properties:
      opp-hz: true
      opp-microvolt: true
      opp-suspend: true
    required:
      - opp-hz
      - opp-microvolt
    unevaluatedProperties: false

required:
  - compatible
  - opp-shared
  - nvmem-cells
  - nvmem-cell-names

unevaluatedProperties: false
