%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/sprd,sc2331-wifi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2331 SDIO Wi-Fi function

maintainers:
  - minorum <mit.mis@gmail.com>

description: |
  The SDIO function depends on a UART bootstrap controller which owns its
  power supplies, clock, reset and firmware startup readiness indication.

properties:
  compatible:
    const: sprd,sc2331-wifi

  reg:
    const: 1

  sprd,boot-controller:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: UART bootstrap controller for this connectivity device

required:
  - compatible
  - reg
  - sprd,boot-controller

additionalProperties: false
...
