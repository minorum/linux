%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/brcm,bcm59035.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM59035 power management IC

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    const: brcm,bcm59035

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1
    description: |
      Interrupt number, calculated as eight times the zero-based status
      register index plus the bit number within that register.

  system-power-controller:
    type: boolean

  regulators:
    type: object
    additionalProperties: false

    properties:
      hcldo2:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false
