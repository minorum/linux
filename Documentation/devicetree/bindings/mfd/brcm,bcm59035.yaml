%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/brcm,bcm59035.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM59035 power management IC

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    const: brcm,bcm59035

  reg:
    maxItems: 1

  system-power-controller:
    type: boolean

  regulators:
    type: object
    additionalProperties: false

    properties:
      hcldo2:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg

additionalProperties: false
