%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/sprd,sc9830-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 shared system registers

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    items:
      - enum:
          - sprd,sc9830-ddr-phy
          - sprd,sc9830-pmu
          - sprd,sc9830-mm-clk
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@402b0000 {
        compatible = "sprd,sc9830-pmu", "syscon";
        reg = <0x402b0000 0x3000>;
    };
