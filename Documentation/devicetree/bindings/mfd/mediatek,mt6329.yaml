%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mediatek,mt6329.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6329 power management IC

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The MT6329 exposes its bank 0 registers at I2C address 0x60. This binding
  describes the fixed 3.3 V VUSB and selectable-voltage VMC regulators
  and the auxiliary ADC. Calibration registers occupy I2C address 0x61.

properties:
  compatible:
    const: mediatek,mt6329
  reg:
    const: 0x60
  clocks:
    maxItems: 1
    description: External 32.768 kHz reference clock.
  mediatek,external-charger:
    type: boolean
    description:
      Battery charging uses an external charger. Disable the internal
      charger, current DAC and charger watchdog before enabling PMIC
      function devices.
  current-sensor:
    $ref: /schemas/iio/adc/mediatek,mt6329-fgadc.yaml#
  adc:
    $ref: /schemas/iio/adc/mediatek,mt6359-auxadc.yaml#
    properties:
      compatible:
        const: mediatek,mt6329-auxadc
    unevaluatedProperties: false
  regulators:
    type: object
    properties:
      vusb:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        properties:
          regulator-min-microvolt:
            const: 3300000
          regulator-max-microvolt:
            const: 3300000
        unevaluatedProperties: false
      vmc:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        properties:
          regulator-min-microvolt:
            minimum: 1300000
            maximum: 3300000
          regulator-max-microvolt:
            minimum: 1300000
            maximum: 3300000
        unevaluatedProperties: false
    additionalProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        pmic@60 {
            compatible = "mediatek,mt6329";
            reg = <0x60>;
            adc {
                compatible = "mediatek,mt6329-auxadc";
                #io-channel-cells = <1>;
            };
            regulators {
                vusb {
                    regulator-name = "vusb";
                    regulator-min-microvolt = <3300000>;
                    regulator-max-microvolt = <3300000>;
                    regulator-always-on;
                };
                vmc {
                    regulator-name = "vmc";
                    regulator-min-microvolt = <3300000>;
                    regulator-max-microvolt = <3300000>;
                    regulator-always-on;
                };
            };
        };
    };
