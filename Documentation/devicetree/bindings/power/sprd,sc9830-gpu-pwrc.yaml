%YAML 1.2
---
$id: http://devicetree.org/schemas/power/sprd,sc9830-gpu-pwrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 GPU power domain

maintainers:
  - minorum <mit.mis@gmail.com>

description: |
  The GPU domain uses the PMU power sequencer and an AON bus gate. Its
  clock mux and divider must be retained across power cycles.

allOf:
  - $ref: power-domain.yaml#

properties:
  compatible:
    const: sprd,sc9830-gpu-pwrc

  '#power-domain-cells':
    const: 0

  sprd,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMU APB syscon.

  sprd,gpu-clk:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: GPU clock syscon.

  clocks:
    maxItems: 1

  clock-names:
    const: bus

required:
  - compatible
  - '#power-domain-cells'
  - sprd,pmu
  - sprd,gpu-clk
  - clocks
  - clock-names

additionalProperties: false
