%YAML 1.2
---
$id: http://devicetree.org/schemas/power/sprd,sc9830-gpu-pwrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 GPU power domain

maintainers:
  - minorum <mit.mis@gmail.com>

description: |
  The GPU_TOP island uses the PMU power sequencer for power and isolation.
  Software controls its transitions with automatic shutdown disabled. The
  AON bus gate and LTEPLL source request are required during power-up, and
  the GPU clock mux and divider must be retained across power cycles.

allOf:
  - $ref: power-domain.yaml#

properties:
  compatible:
    const: sprd,sc9830-gpu-pwrc

  '#power-domain-cells':
    const: 0

  sprd,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMU APB syscon.

  sprd,gpu-clk:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: GPU clock syscon.

  clocks:
    items:
      - description: GPU AON bus gate
      - description: GPU LTEPLL source request gate

  clock-names:
    items:
      - const: bus
      - const: source

required:
  - compatible
  - '#power-domain-cells'
  - sprd,pmu
  - sprd,gpu-clk
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,sc9830-clk.h>

    power-controller-gpu {
        compatible = "sprd,sc9830-gpu-pwrc";
        #power-domain-cells = <0>;
        sprd,pmu = <&pmu>;
        sprd,gpu-clk = <&gpu_clk>;
        clocks = <&aon_gate CLK_GPU_EB>, <&pmu CLK_PMU_LTEPLL_GATE>;
        clock-names = "bus", "source";
    };
