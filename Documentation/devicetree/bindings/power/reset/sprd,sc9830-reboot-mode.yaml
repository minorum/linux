%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/sprd,sc9830-reboot-mode.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 retained SRAM reboot mailbox

maintainers:
  - Sebastian Reichel <sre@kernel.org>

description: |
  A 32-bit word in retained internal SRAM carries a reboot request to the
  bootloader. The mode values are defined by the bootloader protocol.

allOf:
  - $ref: reboot-mode.yaml#

properties:
  compatible:
    const: sprd,sc9830-reboot-mode

  reg:
    maxItems: 1

patternProperties:
  "^mode-.*$":
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/power/sprd,sc9830-reboot-mode.h>

    reboot-mode@f90 {
        compatible = "sprd,sc9830-reboot-mode";
        reg = <0xf90 0x4>;
        mode-normal = <SC9830_BOOT_NORMAL>;
        mode-recovery = <SC9830_BOOT_RECOVERY>;
        mode-bootloader = <SC9830_BOOT_FASTBOOT>;
    };
