%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/mediatek,mt6577-pwrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 RTC power controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The RTC controls the PMIC PWRBB signal through its BBPU register.
  Its protected 16-bit registers are accessed over MMIO with a four-byte
  stride. This node owns the RTC register block for system power-off and
  the optional 32.768 kHz output clock.

properties:
  compatible:
    const: mediatek,mt6577-pwrc

  reg:
    maxItems: 1

  '#clock-cells':
    const: 0

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    power-controller@c1003000 {
        compatible = "mediatek,mt6577-pwrc";
        reg = <0xc1003000 0x7c>;
        #clock-cells = <0>;
    };
