%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/brcm,bcm59035-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM59035 charger

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  Charger function of the BCM59035 power management IC.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: brcm,bcm59035-charger

  monitored-battery: true

  power-supplies:
    maxItems: 1
    description:
      Input power supply. If this references a plain USB-B connector whose
      parent has usb-role-switch, the PMIC USB-present detector is connected
      to that connector's VBUS and controls its device or disconnected role.
      The charger is the sole physical VBUS detector for that port. A default
      USB role and another connector role controller must not be configured.

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    charger {
        compatible = "brcm,bcm59035-charger";
    };
