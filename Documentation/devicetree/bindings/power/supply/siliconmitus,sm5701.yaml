%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/siliconmitus,sm5701.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5701 charger

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The SM5701 integrates a battery charger, a boost converter and flash LED
  control. The charger input status is accessible over I2C.

properties:
  compatible:
    const: siliconmitus,sm5701

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  wakeup-source: true

  io-channels:
    maxItems: 1
    description:
      External battery temperature channel for charging supervision. The
      channel must provide processed temperature in milli-degrees Celsius.

  io-channel-names:
    const: battery-temperature

  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Battery profile containing the safe temperature range in alert-celsius.

  led:
    type: object
    $ref: /schemas/leds/common.yaml#
    unevaluatedProperties: false
    properties:
      led-max-microamp:
        minimum: 10000
        maximum: 320000
        multipleOf: 10000
    required:
      - led-max-microamp

required:
  - compatible
  - reg

dependencies:
  io-channels: [io-channel-names, monitored-battery]
  io-channel-names: [io-channels]
  monitored-battery: [io-channels]

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      charger@49 {
        compatible = "siliconmitus,sm5701";
        reg = <0x49>;
      };
    };
