%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/mediatek,mt6577-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 legacy eMMC controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description: |
  Revision 4 polling PIO eMMC controller with native clock-gate, controller
  reset, timing and electrical-pad initialization. The supported configuration
  is nonremovable, up to 4 bits wide and limited to legacy operation at 12 MHz.
  Pad defaults use the drive encoding qualified on the MODECOM FreeTAB 8001.
  Card power is retained, matching the stock host-0 software policy. Supply
  switching and external card reset are not part of this interface. Active
  SoC pin routing remains configured by the platform. DMA, high-speed modes
  and system power management are not supported.
  The source clock provider owns the controller gate and describes the
  boot-selected source.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: mediatek,mt6577-mmc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: source

  bus-width:
    enum: [1, 4]

  max-frequency:
    maximum: 12000000

  non-removable: true

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - bus-width
  - max-frequency
  - non-removable

unevaluatedProperties: false
