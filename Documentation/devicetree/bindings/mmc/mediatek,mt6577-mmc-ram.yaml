%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/mediatek,mt6577-mmc-ram.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 preinitialized eMMC controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description: |
  Polling PIO eMMC host retaining power and electrical pad settings from
  the preceding boot stage. ECO revision 4 digital timing is initialized by
  the driver. This interface does not provide cold board power-up, DMA,
  high-speed modes or system power management.
  The source clock provider owns the controller gate and describes the
  boot-selected source.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: mediatek,mt6577-mmc-ram

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: source

  bus-width:
    enum: [1, 4]

  max-frequency:
    maximum: 12000000

  non-removable: true

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - bus-width
  - max-frequency
  - non-removable

unevaluatedProperties: false
