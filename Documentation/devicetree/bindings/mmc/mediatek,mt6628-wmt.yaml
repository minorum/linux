%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/mediatek,mt6628-wmt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6628 UART management and power sequencing

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description: |
  The MT6628 combo chip has a UART management interface using WMT over STP.
  Its common firmware must be initialized before the WLAN SDIO function can
  enumerate. The management node is a child of the UART controller and is
  referenced by the SDIO host through mmc-pwrseq.

  Reset, the LDO enable, two power-management enables and the sleep clock
  belong to this common power sequence. The default pin state leaves the
  UART signals as undriven GPIO inputs; the active state selects UART after
  the chip supply and sleep clock have stabilized.

properties:
  compatible:
    const: mediatek,mt6628-wmt

  reset-gpios:
    maxItems: 1
    description: Chip reset, asserted before power is enabled.

  enable-gpios:
    maxItems: 1
    description: LDO enable supplying the combo chip.

  power-gpios:
    minItems: 2
    maxItems: 2
    description: Two power-management enable signals, in assertion order.

  clocks:
    maxItems: 1
    description: 32.768 kHz sleep clock.

  clock-names:
    const: rtc

  mediatek,antenna-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 3, 4]
    description:
      Antenna-routing profile used by the coexistence controller. The
      firmware numbers these profiles from 1 to 4; select the profile
      matching the module's antenna wiring.

  pinctrl-names:
    items:
      - const: default
      - const: active

  pinctrl-0: true
  pinctrl-1: true

required:
  - compatible
  - reset-gpios
  - enable-gpios
  - power-gpios
  - clocks
  - clock-names
  - mediatek,antenna-mode
  - pinctrl-names
  - pinctrl-0
  - pinctrl-1

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    serial {
        connectivity: mcu {
            compatible = "mediatek,mt6628-wmt";
            reset-gpios = <&gpio 59 GPIO_ACTIVE_LOW>;
            enable-gpios = <&gpio 183 GPIO_ACTIVE_HIGH>;
            power-gpios = <&gpio 185 GPIO_ACTIVE_HIGH>,
                          <&gpio 149 GPIO_ACTIVE_HIGH>;
            clocks = <&rtc_clock>;
            clock-names = "rtc";
            mediatek,antenna-mode = <1>;
            pinctrl-names = "default", "active";
            pinctrl-0 = <&combo_safe>;
            pinctrl-1 = <&combo_uart>;
        };
    };
