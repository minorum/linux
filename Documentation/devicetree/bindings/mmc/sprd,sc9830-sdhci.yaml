%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/sprd,sc9830-sdhci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 eMMC controller

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  eMMC access with firmware-initialized power, an owned host
  clock gate, reset and board pin configuration.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: sprd,sc9830-sdhci
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 1
  resets:
    maxItems: 1
  reset-names:
    const: host
  bus-width:
    enum: [1, 4, 8]
  max-frequency:
    maximum: 52000000

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - reset-names
  - pinctrl-names
  - pinctrl-0
  - non-removable

unevaluatedProperties: false
