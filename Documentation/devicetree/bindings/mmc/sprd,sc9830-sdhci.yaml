%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/sprd,sc9830-sdhci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 SDHCI for RAM bring-up

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  Conservative eMMC access with firmware-initialized power and board pad setup.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: sprd,sc9830-sdhci
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 1
  bus-width:
    const: 1
  max-frequency:
    maximum: 12000000

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - non-removable

unevaluatedProperties: false
