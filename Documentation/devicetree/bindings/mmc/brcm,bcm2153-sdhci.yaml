%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/brcm,bcm2153-sdhci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 SDHCI controller

maintainers:
  - minorum <mit.mis@gmail.com>

allOf:
  - $ref: mmc-controller.yaml#

description:
  Each host has an SDHCI register window, separate reset and interrupt controls,
  and a dedicated external clock gate/divider pair. The divider output is
  the 52 MHz input divided by one plus the programmed divider value.
  The card supply must be enabled before selecting the powered pin state,
  which precedes host reset and card enumeration.

properties:
  compatible:
    const: brcm,bcm2153-sdhci

  reg:
    items:
      - description: SDHCI registers
      - description: Reset/control, status and interrupt mask registers
      - description: Clock gate and divider words

  reg-names:
    items:
      - const: host
      - const: control
      - const: clock

  clock-frequency:
    const: 52000000

  interrupts:
    maxItems: 1

  pinctrl-0: true

  pinctrl-names:
    items:
      - const: powered

required:
  - compatible
  - reg
  - reg-names
  - clock-frequency
  - interrupts
  - vmmc-supply
  - pinctrl-0
  - pinctrl-names

unevaluatedProperties: false

examples:
  - |
    mmc@8120000 {
        compatible = "brcm,bcm2153-sdhci";
        reg = <0x08120000 0x100>, <0x08128000 0xc>, <0x08140038 0x8>;
        reg-names = "host", "control", "clock";
        clock-frequency = <52000000>;
        interrupts = <26 4>;
        vmmc-supply = <&vmmc>;
        pinctrl-names = "powered";
        pinctrl-0 = <&sd1_pins>;
        bus-width = <4>;
        max-frequency = <25000000>;
    };
