%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/brcm,bcm2153-sdhci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 SDHCI controller

maintainers:
  - minorum <mit.mis@gmail.com>

allOf:
  - $ref: mmc-controller.yaml#

description:
  Each host has an SDHCI register window, a separate reset/control word,
  and a dedicated external clock gate/divider pair. The divider output is
  the 52 MHz input divided by one plus the programmed divider value.

properties:
  compatible:
    const: brcm,bcm2153-sdhci

  reg:
    items:
      - description: SDHCI registers
      - description: Reset/control word
      - description: Clock gate and divider words

  reg-names:
    items:
      - const: host
      - const: control
      - const: clock

  clock-frequency:
    const: 52000000

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - clock-frequency

unevaluatedProperties: false

examples:
  - |
    mmc@8120000 {
        compatible = "brcm,bcm2153-sdhci";
        reg = <0x08120000 0x100>, <0x08128000 0x4>, <0x08140038 0x8>;
        reg-names = "host", "control", "clock";
        clock-frequency = <52000000>;
        bus-width = <4>;
        max-frequency = <25000000>;
    };
