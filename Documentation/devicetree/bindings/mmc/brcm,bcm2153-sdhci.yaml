%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/brcm,bcm2153-sdhci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 SDHCI controller

maintainers:
  - minorum <mit.mis@gmail.com>

allOf:
  - $ref: mmc-controller.yaml#

description:
  Each host has an SDHCI register window, a separate interrupt mask,
  and a dedicated external clock gate/divider pair. The divider output is
  the 52 MHz input divided by one plus the programmed divider value.
  The card supply must be enabled before selecting powered-init followed
  by powered. These states clear and configure the mux before host reset
  and card enumeration.
  External reset is provided by the SDIO wrapper reset controller.

properties:
  compatible:
    const: brcm,bcm2153-sdhci

  reg:
    items:
      - description: SDHCI registers
      - description: Interrupt mask word
      - description: Clock gate and divider words

  reg-names:
    items:
      - const: host
      - const: interrupt-mask
      - const: clock

  clock-frequency:
    const: 52000000

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

  pinctrl-0: true
  pinctrl-1: true

  pinctrl-names:
    items:
      - const: powered-init
      - const: powered

required:
  - compatible
  - reg
  - reg-names
  - clock-frequency
  - interrupts
  - resets
  - vmmc-supply
  - pinctrl-0
  - pinctrl-1
  - pinctrl-names

unevaluatedProperties: false

examples:
  - |
    mmc@8120000 {
        compatible = "brcm,bcm2153-sdhci";
        reg = <0x08120000 0x100>, <0x08128008 0x4>, <0x08140038 0x8>;
        reg-names = "host", "interrupt-mask", "clock";
        resets = <&sd1_reset>;
        clock-frequency = <52000000>;
        interrupts = <26 4>;
        vmmc-supply = <&vmmc>;
        pinctrl-names = "powered-init", "powered";
        pinctrl-0 = <&sd1_clear_pins>;
        pinctrl-1 = <&sd1_pins>;
        bus-width = <4>;
        max-frequency = <25000000>;
    };
