%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/sprd,sc9830-sdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 SDIO controller

maintainers:
  - minorum <mit.mis@gmail.com>

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: sprd,sc9830-sdio

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  bus-width:
    const: 4

  max-frequency:
    maximum: 50000000

  sprd,phy-delay:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    description:
      Write, positive-edge read and negative-edge read delay register values,
      in that order, restored after controller reset.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - bus-width
  - sprd,phy-delay

unevaluatedProperties: false

examples:
  - |
    mmc@20400000 {
        compatible = "sprd,sc9830-sdio";
        reg = <0x20400000 0x1000>;
        interrupts = <0 58 4>;
        clocks = <&sdio1_clk>;
        bus-width = <4>;
        max-frequency = <50000000>;
        sprd,phy-delay = <3 3 3>;
        non-removable;
        no-sd;
        no-mmc;
        no-1-8-v;
    };
