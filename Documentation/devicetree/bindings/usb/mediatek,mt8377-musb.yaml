%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/mediatek,mt8377-musb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8377 MUSB controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  Peripheral-only PIO controller with a separate USB PHY. Controller reset
  uses the local software reset register.

allOf:
  - $ref: usb-drd.yaml#

properties:
  compatible:
    enum:
      - mediatek,mt8377-musb
      - mediatek,mt6577-musb

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: mc

  dr_mode:
    const: peripheral

  clocks:
    maxItems: 1

  clock-names:
    const: bus

  phys:
    maxItems: 1

  phy-names:
    const: usb2-phy

  power-supplies:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1
    items:
      maxItems: 1
    description:
      Charger receiving the USB peripheral's authorized input-current budget.
      Reset, configuration, suspend and disconnect update its current limit.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - dr_mode
  - clocks
  - clock-names
  - phys
  - phy-names

unevaluatedProperties: false
