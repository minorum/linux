%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/mediatek,mt6577-musb-ram.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 RAM-stage MUSB controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description: |
  Peripheral-only PIO controller with clocks, power and PHY calibration
  retained from the preceding boot stage. This interface does not provide
  cold initialization or system power management.

allOf:
  - $ref: usb-drd.yaml#

properties:
  compatible:
    const: mediatek,mt6577-musb-ram

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: mc

  dr_mode:
    const: peripheral

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - dr_mode

unevaluatedProperties: false
