%YAML 1.2
---
$id: http://devicetree.org/schemas/display/sprd,sc9830-dispc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 display controller

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    const: sprd,sc9830-dispc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Display core mux/divider and AP-AHB gate
      - description: Display DBI clock
      - description: Display pixel clock
      - description: Display memory interface gate

  clock-names:
    items:
      - const: core
      - const: dbi
      - const: dpi
      - const: emc

  resets:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Pixel output to the DSI host.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,sc9830-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    display-controller@20800000 {
        compatible = "sprd,sc9830-dispc";
        reg = <0x20800000 0x1000>;
        interrupts = <GIC_SPI 46 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&apahb CLK_DISPC_EB>, <&ap_clk CLK_DISPC_DBI>,
                 <&ap_clk CLK_DISPC_DPI>, <&aon_gate CLK_DISP_EMC_EB>;
        clock-names = "core", "dbi", "dpi", "emc";
        resets = <&apahb 1>;

        port {
            endpoint {
                remote-endpoint = <&dsi_in>;
            };
        };
    };
