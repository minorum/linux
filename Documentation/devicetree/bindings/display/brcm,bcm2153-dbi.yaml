%YAML 1.2
---
$id: http://devicetree.org/schemas/display/brcm,bcm2153-dbi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 parallel Display Bus Interface

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    const: brcm,bcm2153-dbi

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  panel:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: samsung,gt-s5620-lcd
    required:
      - compatible

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    display@8030000 {
        compatible = "brcm,bcm2153-dbi";
        reg = <0x08030000 0x20>;

        panel {
            compatible = "samsung,gt-s5620-lcd";
        };
    };
