%YAML 1.2
---
$id: http://devicetree.org/schemas/display/mediatek/mediatek,mt8377-dpi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8377 DPI display controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The MT8377 DPI controller includes framebuffer DMA and a parallel RGB
  timing generator. It is distinct from the DPI output blocks found in
  newer MediaTek display pipelines.
  The parallel output uses RGB888 on 24 data lines, including when a
  downstream bridge reports a fixed bus format.

properties:
  compatible:
    enum:
      - mediatek,mt8377-dpi
      - mediatek,mt6577-dpi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: DPI engine gate
      - description: SMI LARB1 gate
      - description: SMI LARB1 EMI gate
      - description: MIPI TX PLL source

  clock-names:
    items:
      - const: engine
      - const: larb
      - const: larb-emi
      - const: pll

  mediatek,mmsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MMSYS configuration controller providing DPI pin routing

  power-domains:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Parallel RGB output

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - mediatek,mmsys
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/clock/mediatek,mt8377-mmsys.h>

    display-controller@c208c000 {
        compatible = "mediatek,mt8377-dpi";
        reg = <0xc208c000 0xb8>;
        interrupts = <GIC_SPI 11 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&mmsys CLK_MT8377_MM_DPI>,
                 <&mmsys CLK_MT8377_MM_LARB1>,
                 <&mmsys CLK_MT8377_MM_LARB1_EMI>, <&mipi_tx>;
        clock-names = "engine", "larb", "larb-emi", "pll";
        mediatek,mmsys = <&mmsys>;

        port {
            dpi_out: endpoint {
                remote-endpoint = <&bridge_in>;
            };
        };
    };
