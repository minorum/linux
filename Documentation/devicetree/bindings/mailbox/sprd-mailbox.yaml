%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/sprd-mailbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum mailbox controller

description: |
  The Samsung SM-J320FN compatible selects the installed firmware handover
  protocol. The additional resources expose shared counters temporarily during
  AP bank initialization and the separate PM processor bank for read-only checks.

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

properties:
  compatible:
    enum:
      - samsung,j320fn-mailbox
      - sprd,sc9830-mailbox
      - sprd,sc9860-mailbox
      - sprd,sc9863a-mailbox
      - sprd,ums9230-mailbox

  reg:
    minItems: 2
    items:
      - description: inbox registers' base address
      - description: outbox registers' base address
      - description: Temporary handover view of four PM shared-ring counters
      - description: Read-only PM processor outbox bank

  interrupts:
    minItems: 2
    maxItems: 3

  interrupt-names:
    minItems: 2
    items:
      - const: inbox
      - const: outbox
      - const: supp-outbox

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: enable

  "#mbox-cells":
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - "#mbox-cells"
  - clocks
  - clock-names

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          const: samsung,j320fn-mailbox
    then:
      properties:
        reg:
          minItems: 4
        interrupts:
          maxItems: 2
        interrupt-names:
          maxItems: 2
    else:
      properties:
        reg:
          maxItems: 2

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    mailbox: mailbox@400a0000 {
      compatible = "sprd,sc9860-mailbox";
      reg = <0x400a0000 0x8000>, <0x400a8000 0x8000>;
      #mbox-cells = <1>;
      clock-names = "enable";
      clocks = <&aon_gate 53>;
      interrupts = <GIC_SPI 28 IRQ_TYPE_LEVEL_HIGH>, <GIC_SPI 29 IRQ_TYPE_LEVEL_HIGH>;
      interrupt-names = "inbox", "outbox";
    };
...
