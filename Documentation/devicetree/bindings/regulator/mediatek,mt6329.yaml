%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6329.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6329 power management IC

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The MT6329 exposes its bank 0 registers at I2C address 0x60. This binding
  describes the fixed 3.3 V VUSB and selectable-voltage VMC regulators.

properties:
  compatible:
    const: mediatek,mt6329
  reg:
    const: 0x60
  regulators:
    type: object
    properties:
      vusb:
        type: object
        $ref: regulator.yaml#
        properties:
          regulator-min-microvolt:
            const: 3300000
          regulator-max-microvolt:
            const: 3300000
        unevaluatedProperties: false
      vmc:
        type: object
        $ref: regulator.yaml#
        properties:
          regulator-min-microvolt:
            minimum: 1300000
            maximum: 3300000
          regulator-max-microvolt:
            minimum: 1300000
            maximum: 3300000
        unevaluatedProperties: false
    additionalProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        pmic@60 {
            compatible = "mediatek,mt6329";
            reg = <0x60>;
            regulators {
                vusb {
                    regulator-name = "vusb";
                    regulator-min-microvolt = <3300000>;
                    regulator-max-microvolt = <3300000>;
                    regulator-always-on;
                };
                vmc {
                    regulator-name = "vmc";
                    regulator-min-microvolt = <3300000>;
                    regulator-max-microvolt = <3300000>;
                    regulator-always-on;
                };
            };
        };
    };
