%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/sprd,sc2723-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2723 CPU and fixed-voltage regulators

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

description: |
  Factory-calibrated connectivity supplies used at 1.6 V (vddcon) and
  3.3 V (vddwifipa), and the touchscreen supply at 3 V (vddsim2).
  Other operating voltages are currently unsupported.
  Calibration state bit 7 at eFuse byte 0 must be clear. The connectivity
  trim occupies bits 105 through 111; the Wi-Fi PA trim occupies bits
  164 through 169. The trims are centered at 64 and 32 respectively.
  The always-on CPU supply supports linear or coarse/trim selector encoding,
  selected by the PMIC mode register. CPU voltages describe raw selector values;
  request-dependent factory compensation is applied by the CPU OPP policy.
  The SIM2 trim occupies bits 206 through 211, centered at 32. Its trim is
  scaled from the factory 1.8 V reference to the requested 3 V supply.
  The eMMC I/O and core supplies retain their boot-programmed 1.8 V and 3 V
  selectors with OTP compensation enabled. Voltage changes are unsupported.
  The panel supply vddkpled retains its firmware voltage selector. Its
  reported voltage uses the six-bit trim from eFuse bits 152 through 157,
  centered at 32 with a 3.3 V factory reference. Voltage changes are
  unsupported. Its calibration cells are
  supplied on the regulator child independently of connectivity calibration.
  The sensor supplies vdd18 and vdd28 retain their boot-programmed 1.8 V
  and 2.8 V selectors with OTP compensation enabled. Voltage changes are
  unsupported, and these shared supplies must remain always on.

allOf:
  - if:
      anyOf:
        - required: [vddarm]
        - required: [vddcon]
        - required: [vddwifipa]
        - required: [vddsim2]
    then:
      required: [nvmem-cells, nvmem-cell-names]
  - if:
      required: [vddsim2]
    then:
      properties:
        nvmem-cells:
          minItems: 4
        nvmem-cell-names:
          minItems: 4

properties:
  compatible:
    const: sprd,sc2723-regulator

  vdd18:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 1800000
      regulator-max-microvolt:
        const: 1800000
      regulator-always-on: true
      regulator-boot-on: true
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-always-on
      - regulator-boot-on
    unevaluatedProperties: false

  vdd28:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 2800000
      regulator-max-microvolt:
        const: 2800000
      regulator-always-on: true
      regulator-boot-on: true
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-always-on
      - regulator-boot-on
    unevaluatedProperties: false

  vddgen0:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 1800000
      regulator-max-microvolt:
        const: 1800000
      regulator-always-on: true
      regulator-boot-on: true
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-always-on
      - regulator-boot-on
    unevaluatedProperties: false

  vddemmccore:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 3000000
      regulator-max-microvolt:
        const: 3000000
      regulator-always-on: true
      regulator-boot-on: true
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-always-on
      - regulator-boot-on
    unevaluatedProperties: false

  vddkpled:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        minimum: 1200000
        maximum: 3760000
      regulator-max-microvolt:
        minimum: 1200000
        maximum: 3760000
      nvmem-cells:
        items:
          - description: Factory calibration validity bit
          - description: Panel voltage trim
      nvmem-cell-names:
        items:
          - const: calibration_state
          - const: vddkpled
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - nvmem-cells
      - nvmem-cell-names
    unevaluatedProperties: false

  nvmem-cells:
    minItems: 3
    items:
      - description: Factory calibration validity bit
      - description: Connectivity voltage trim
      - description: Wi-Fi PA voltage trim
      - description: SIM2 voltage trim

  nvmem-cell-names:
    minItems: 3
    items:
      - const: calibration_state
      - const: vddcon
      - const: vddwifipa
      - const: vddsim2

  vddsim2:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 3000000
      regulator-max-microvolt:
        const: 3000000
    unevaluatedProperties: false

  vddarm:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        minimum: 600000
        maximum: 3125000
      regulator-max-microvolt:
        minimum: 600000
        maximum: 3125000
      regulator-always-on: true
      regulator-boot-on: true
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-always-on
      - regulator-boot-on
    unevaluatedProperties: false

  vddcon:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 1600000
      regulator-max-microvolt:
        const: 1600000
    unevaluatedProperties: false

  vddwifipa:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 3300000
      regulator-max-microvolt:
        const: 3300000
    unevaluatedProperties: false

required:
  - compatible

anyOf:
  - required: [nvmem-cells, nvmem-cell-names]
  - required: [vddgen0, vddemmccore]

additionalProperties: false
...
