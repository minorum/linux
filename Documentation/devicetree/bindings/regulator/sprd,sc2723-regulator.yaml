%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/sprd,sc2723-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2723 CPU and connectivity regulators

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

description: |
  Factory-calibrated connectivity supplies used at 1.6 V (vddcon) and
  3.3 V (vddwifipa). Other operating voltages are currently unsupported.
  Calibration state bit 7 at eFuse byte 0 must be clear. The connectivity
  trim occupies bits 105 through 111; the Wi-Fi PA trim occupies bits
  164 through 169. The trims are centered at 64 and 32 respectively.
  The always-on CPU supply supports linear or coarse/trim selector encoding,
  selected by the PMIC mode register. CPU voltages describe raw selector values;
  request-dependent factory compensation is applied by the CPU OPP policy.

properties:
  compatible:
    const: sprd,sc2723-regulator

  nvmem-cells:
    items:
      - description: Factory calibration validity bit
      - description: Connectivity voltage trim
      - description: Wi-Fi PA voltage trim

  nvmem-cell-names:
    items:
      - const: calibration_state
      - const: vddcon
      - const: vddwifipa

  vddarm:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        minimum: 600000
        maximum: 3125000
      regulator-max-microvolt:
        minimum: 600000
        maximum: 3125000
      regulator-always-on: true
      regulator-boot-on: true
    required:
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-always-on
      - regulator-boot-on
    unevaluatedProperties: false

  vddcon:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 1600000
      regulator-max-microvolt:
        const: 1600000
    unevaluatedProperties: false

  vddwifipa:
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-min-microvolt:
        const: 3300000
      regulator-max-microvolt:
        const: 3300000
    unevaluatedProperties: false

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false
...
