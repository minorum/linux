%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/mediatek,mt6577-i2c-dual.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 dual-channel I2C controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The dual-channel controller has shared interrupt and reset registers.
  Channel1 supports SMBus byte-data access. Channel2 state is retained;
  shared clock and reset ownership must account for its independent users.
  The main clock has a fixed internal divide by16.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: mediatek,mt6577-i2c-dual
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    const: main
  clock-frequency:
    const: 100000
  mediatek,use-push-pull:
    type: boolean
    description: Use push-pull instead of open-drain SCL and SDA outputs.

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c@c1014000 {
        compatible = "mediatek,mt6577-i2c-dual";
        reg = <0xc1014000 0xc0>;
        interrupts = <GIC_SPI 73 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&i2c_dual>;
        clock-names = "main";
        clock-frequency = <100000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
