%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sprd,sc9830-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 I2C controller

maintainers:
  - minorum <mit.mis@gmail.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sprd,sc9830-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: I2C mux and divider clock, configured to 26 MHz
      - description: I2C module gate clock

  clock-names:
    items:
      - const: i2c
      - const: enable

  clock-frequency:
    enum: [100000, 400000]
    default: 100000

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,sc9830-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c@70700000 {
        compatible = "sprd,sc9830-i2c";
        reg = <0x70700000 0x1000>;
        interrupts = <GIC_SPI 13 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&ap_clk CLK_I2C2>, <&apapb CLK_I2C2_EB>;
        clock-names = "i2c", "enable";
        #address-cells = <1>;
        #size-cells = <0>;
    };
