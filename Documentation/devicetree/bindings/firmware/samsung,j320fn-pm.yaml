%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/samsung,j320fn-pm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Galaxy J3 SM-J320FN PM firmware transport

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

description: |
  The Samsung SM-J320FN PM firmware exchanges DDR control messages with the
  application processor through two shared SRAM rings and a mailbox doorbell.
  The SRAM contains 128 eight-byte slots in each direction, followed by four
  32-bit reader and writer counters. This interface describes the installed
  Samsung firmware protocol, rather than a generic SC9830 firmware interface.

properties:
  compatible:
    const: samsung,j320fn-pm

  reg:
    maxItems: 1
    description: Shared transmit and receive rings and their counters.

  mboxes:
    maxItems: 1
    description: PM processor doorbell channel.

  mbox-names:
    items:
      - const: pm

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: emc

  '#clock-cells':
    const: 0
    description: |
      Provides the firmware-reported effective DDR clock. The input emc clock
      describes the inherited AON configuration and must not use this output.

required:
  - compatible
  - reg
  - mboxes
  - mbox-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,sc9830-clk.h>

    pm@5000c000 {
        compatible = "samsung,j320fn-pm";
        reg = <0x5000c000 0x1000>;
        mboxes = <&mailbox 1>;
        mbox-names = "pm";
        clocks = <&aon_mux CLK_EMC>;
        clock-names = "emc";
    };
