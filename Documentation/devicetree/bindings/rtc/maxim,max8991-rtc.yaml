%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/maxim,max8991-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung GT-S5620 standalone RTC interface

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The Samsung GT-S5620 has an observed eight-byte BCD calendar interface at
  I2C address 0x68, starting at register 0. Its silicon ownership is unresolved.
  The compatible is a retained local identifier for the board-validated
  standalone read-only driver, not an established MAX8991 compatibility claim.

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    const: maxim,max8991-rtc

  reg:
    const: 0x68

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@68 {
            compatible = "maxim,max8991-rtc";
            reg = <0x68>;
        };
    };
