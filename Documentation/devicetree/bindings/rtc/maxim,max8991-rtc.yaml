%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/maxim,max8991-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX8991 Real Time Clock

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The MAX8991 power-management IC exposes its calendar through a separate
  I2C slave interface at address 0x68.

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    const: maxim,max8991-rtc

  reg:
    const: 0x68

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@68 {
            compatible = "maxim,max8991-rtc";
            reg = <0x68>;
        };
    };
