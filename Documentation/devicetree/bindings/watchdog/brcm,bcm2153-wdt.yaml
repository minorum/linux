%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/brcm,bcm2153-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 application processor watchdog

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The AP watchdog is the second counter in the watchdog bank. It uses
  16-bit register accesses and a 1 Hz countdown derived from the slow clock.
  The first counter belongs to the modem processor and is separate.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: brcm,bcm2153-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: slow

  timeout-sec:
    minimum: 1
    maximum: 255
    default: 60

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    watchdog@88a0010 {
        compatible = "brcm,bcm2153-wdt";
        reg = <0x088a0010 8>;
        clocks = <&osc32k>;
        clock-names = "slow";
        timeout-sec = <60>;
    };
