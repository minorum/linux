%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/sprd,sc2723-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2723 analog watchdog

maintainers:
  - minorum <mit.mis@gmail.com>

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: sprd,sc2723-wdt

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    pmic {
        #address-cells = <1>;
        #size-cells = <0>;
        watchdog@40 {
            compatible = "sprd,sc2723-wdt";
            reg = <0x40>;
        };
    };
