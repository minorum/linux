%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/mediatek,mt8377-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8377 USB 2.0 PHY

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

properties:
  compatible:
    enum:
      - mediatek,mt8377-usb-phy
      - mediatek,mt6577-usb-phy
  reg:
    maxItems: 1
  clocks:
    maxItems: 2
  clock-names:
    items:
      - const: upll
      - const: bus
  vusb33-supply:
    description: 3.3V analog supply
  mediatek,bc11:
    type: boolean
    description:
      Enable BC1.1 source detection in the MT6329 PMIC supplying vusb33.
  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - vusb33-supply
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    phy@c1260800 {
        compatible = "mediatek,mt8377-usb-phy";
        reg = <0xc1260800 0x800>;
        clocks = <&upll>, <&usb_clk>;
        clock-names = "upll", "bus";
        vusb33-supply = <&vusb>;
        #phy-cells = <0>;
    };
