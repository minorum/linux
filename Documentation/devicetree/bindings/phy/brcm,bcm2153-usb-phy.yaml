%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/brcm,bcm2153-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 USB PHY

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The integrated USB PHY has a wrapper control word and a separate analog
  control word in the system configuration block. Device-mode initialization
  uses both resources. The UTMI interface is eight bits wide.

properties:
  compatible:
    const: brcm,bcm2153-usb-phy

  reg:
    items:
      - description: USB wrapper control
      - description: USB analog configuration

  reg-names:
    items:
      - const: wrapper
      - const: analog

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    phy@8280000 {
        compatible = "brcm,bcm2153-usb-phy";
        reg = <0x08280000 4>, <0x088800a4 4>;
        reg-names = "wrapper", "analog";
        #phy-cells = <0>;
    };
