%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/rmem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Reserved Memory Based nvmem Device

description:
  Reserved memory containing configuration retained by boot firmware. On
  Samsung GT-S5620, the region contains two little-endian 16-bit battery
  voltage calibration words from the dependent parameter table.

maintainers:
  - Nicolas Saenz Julienne <nsaenzjulienne@suse.de>

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    items:
      - enum:
          - mobileye,eyeq5-bootloader-config
          - raspberrypi,bootloader-config
          - raspberrypi,bootloader-public-key
          - samsung,gt-s5620-battery-calibration
      - const: nvmem-rmem

  reg:
    maxItems: 1

  no-map:
    $ref: /schemas/types.yaml#/definitions/flag
    description:
      Avoid creating a virtual mapping of the region as part of the OS'
      standard mapping of system memory.

required:
  - compatible
  - no-map

unevaluatedProperties: false

examples:
  - |
        reserved-memory {
                #address-cells = <1>;
                #size-cells = <1>;

                blconfig: nvram@10000000 {
                        compatible = "raspberrypi,bootloader-config", "nvmem-rmem";
                        #address-cells = <1>;
                        #size-cells = <1>;
                        reg = <0x10000000 0x1000>;
                        no-map;
                };
        };

...
