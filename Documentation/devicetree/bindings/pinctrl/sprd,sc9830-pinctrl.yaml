%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/sprd,sc9830-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 pin multiplexer

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The controller has per-pad registers and separate global controls.
  The I2C2, UART0, SDIO1 and eMMC alternate functions are supported. GPIO
  mode selects the pad function and does not configure the GPIO controller.
  The panel-reset group selects GPIO mode on LCM_RSTN.

allOf:
  - $ref: pinctrl.yaml#

properties:
  compatible:
    const: sprd,sc9830-pinctrl

  reg:
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    allOf:
      - $ref: pinmux-node.yaml#
    unevaluatedProperties: false
    properties:
      function:
        enum: [i2c2, gpio, uart0, sdio1, emmc]
      groups:
        items:
          enum: [i2c2, uart0, sdio1, emmc-data, emmc-clock, panel-reset]
        maxItems: 1
      pins: false
      bias-disable:
        type: boolean
      bias-pull-up:
        type: boolean
      bias-pull-down:
        type: boolean
      sprd,drive-level:
        description: Raw two-bit drive selector; no current in milliamps is implied.
        $ref: /schemas/types.yaml#/definitions/uint32
        minimum: 0
        maximum: 3
    required:
      - function
      - groups

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    pinctrl@402a0000 {
        compatible = "sprd,sc9830-pinctrl";
        reg = <0x402a0000 0x1000>;

        i2c2-pins {
            function = "i2c2";
            groups = "i2c2";
        };
    };
