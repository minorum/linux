%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/brcm,bcm2153-auxadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 auxiliary ADC

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  Eight-channel auxiliary ADC with 8-bit results and 16-bit register accesses.
  The controller must be exclusively owned by the application processor.

properties:
  compatible:
    const: brcm,bcm2153-auxadc

  reg:
    maxItems: 1

  "#io-channel-cells":
    const: 1

required:
  - compatible
  - reg
  - "#io-channel-cells"

additionalProperties: false

examples:
  - |
    adc@8830020 {
        compatible = "brcm,bcm2153-auxadc";
        reg = <0x08830020 0x0a>;
        #io-channel-cells = <1>;
    };
