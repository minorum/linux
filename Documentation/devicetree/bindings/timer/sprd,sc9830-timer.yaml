%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/sprd,sc9830-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 general-purpose timer

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  Three 32-bit down counters share one register block. Channel zero provides
  a clock event and channel one provides a free-running clock source.

properties:
  compatible:
    const: sprd,sc9830-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    description: Gated functional clock for the timer register block.
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/sprd,sc9830-clk.h>

    timer@40050000 {
      compatible = "sprd,sc9830-timer";
      reg = <0x40050000 0x60>;
      interrupts = <GIC_SPI 28 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&aon_gate CLK_AON_TMR_EB>;
    };
