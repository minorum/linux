%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/sprd,sc9830-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 general-purpose timer

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  Four CPU timer blocks each contain three 32-bit down counters. Channel zero
  provides a local clock event. CPU0 channel one provides the clock source.
  Resources, interrupts and clocks are ordered by CPU affinity f00 through f03.
  A single block describes the legacy CPU0-only configuration.

properties:
  compatible:
    const: sprd,sc9830-timer

  reg:
    minItems: 1
    maxItems: 4

  interrupts:
    minItems: 1
    maxItems: 4

  clocks:
    description: Gated functional clock for each timer register block.
    minItems: 1
    maxItems: 4

required:
  - compatible
  - reg
  - interrupts
  - clocks

oneOf:
  - properties:
      reg:
        maxItems: 1
      interrupts:
        maxItems: 1
      clocks:
        maxItems: 1
  - properties:
      reg:
        minItems: 4
      interrupts:
        minItems: 4
      clocks:
        minItems: 4

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/sprd,sc9830-clk.h>

    timer@40050000 {
      compatible = "sprd,sc9830-timer";
      reg = <0x40050000 0x60>;
      interrupts = <GIC_SPI 28 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&aon_gate CLK_AON_TMR_EB>;
    };
