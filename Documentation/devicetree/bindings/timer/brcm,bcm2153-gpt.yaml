%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/brcm,bcm2153-gpt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 general-purpose timers

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The block contains six 32-bit downcounters with individual control and
  reload registers, at a channel stride of 16 bytes. The slow clock input
  runs at 32768 Hz. Channel zero can provide a polled bootloader timebase.
  Linux uses channel zero as its clocksource and channel one for software
  one-shot clockevents. The node owns all six channels; unused channel
  interrupts are disabled during initialization.

properties:
  compatible:
    const: brcm,bcm2153-gpt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: slow

  interrupts:
    minItems: 1
    maxItems: 2
    description:
      The first interrupt is AP IRQ 11 for channels with interrupt assignment
      bit clear. The optional second interrupt is AP IRQ 62 for channels with
      that bit set. Linux requires the first interrupt; polled bootloader use
      does not require an interrupt.

required:
  - compatible
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    timer@8830100 {
        compatible = "brcm,bcm2153-gpt";
        reg = <0x08830100 0x60>;
        clocks = <&osc32k>;
        clock-names = "slow";
    };
