%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/brcm,bcm2153-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 application processor interrupt controller

maintainers:
  - minorum <mit.mis@gmail.com>

description: |
  The application processor controller has two banks of 32 interrupt slots,
  at offsets 0 and 0x100. Its register window is 0x200 bytes. This controller
  is separate from the modem processor interrupt controller.

  Interrupts routed to FIQ by firmware are outside the Linux IRQ domain.
  Their routing, enable bits and pending state are preserved. Linux does not
  provide the firmware FIQ handler. The flags cell must specify a qualified
  trigger type; unspecified trigger types are unsupported.

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

properties:
  compatible:
    const: brcm,bcm2153-intc

  reg:
    maxItems: 1

  interrupt-controller: true

  '#address-cells':
    const: 0

  '#interrupt-cells':
    const: 2
    description: |
      The first cell is the AP interrupt number from 0 to 63. The second
      cell uses IRQ_TYPE_* flags for rising, falling, both edges, high level
      or low level. Firmware-routed FIQ sources cannot be mapped.

required:
  - compatible
  - reg
  - interrupt-controller
  - '#address-cells'
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    interrupt-controller@8810000 {
        compatible = "brcm,bcm2153-intc";
        reg = <0x08810000 0x200>;
        interrupt-controller;
        #address-cells = <0>;
        #interrupt-cells = <2>;
    };
