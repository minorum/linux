%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,sc9830-gpu-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 GPU clock controller

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    items:
      - const: sprd,sc9830-gpu-clk
      - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 0

  clocks:
    items:
      - description: TWPLL 153.6 MHz
      - description: Requested LTEPLL divided by two, 614.4 MHz
      - description: TWPLL 256 MHz
      - description: TWPLL 307.2 MHz
      - description: TWPLL 384 MHz
      - description: TWPLL 512 MHz

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - '#clock-cells'
  - clocks
  - power-domains

additionalProperties: false
