%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt8377-infracfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8377 infrastructure clock controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The infrastructure controller selects and divides the AXI clock. The WPLL
  input is needed when that source is selected by firmware.

properties:
  compatible:
    enum:
      - mediatek,mt8377-infracfg
      - mediatek,mt6577-infracfg
  reg:
    maxItems: 1
  clocks:
    minItems: 2
    maxItems: 3
  clock-names:
    minItems: 2
    items:
      - const: clk26m
      - const: mainpll
      - const: wpll
  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt8377-clk.h>
    clock-controller@c0001000 {
        compatible = "mediatek,mt8377-infracfg";
        reg = <0xc0001000 0x1000>;
        clocks = <&clk26m>, <&apmixedsys CLK_MT8377_MAINPLL>;
        clock-names = "clk26m", "mainpll";
        #clock-cells = <1>;
    };
