%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt8377-mmsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8377 multimedia clock gates

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  MMSYS provides the clock gates for the DPI engine and SMI memory fabric.
  Upstream clock sources are configured by firmware. Gate rates are unknown.

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt8377-mmsys
          - mediatek,mt6577-mmsys
      - const: syscon

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Register bus clock

  clock-names:
    items:
      - const: bus

  '#clock-cells':
    const: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

dependencies:
  clocks: [clock-names]
  clock-names: [clocks]

examples:
  - |
    clock-controller@c2080000 {
        compatible = "mediatek,mt8377-mmsys", "syscon";
        reg = <0xc2080000 0x1000>;
        #clock-cells = <1>;
    };
