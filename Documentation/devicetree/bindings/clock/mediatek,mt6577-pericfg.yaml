%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6577-pericfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 peripheral clock controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The peripheral controller provides the PWM functional reference and clock
  gates, the dual I2C gate, and the MSDC0 and MSDC3 source selectors and gates. PWM
  channels4 through6 share one gate. MSDC0 and MSDC3 support the 26MHz and nominal
  WPLL197MHz source selections. USB supports the nominal WPLL61MHz source;
  its alternative source is not supported. UART2 uses the AXI clock divided
  by four and has an independent gate.

properties:
  compatible:
    const: mediatek,mt6577-pericfg
  reg:
    maxItems: 1
  clocks:
    maxItems: 4
  clock-names:
    items:
      - const: axi
      - const: clk26m
      - const: wpll197
      - const: wpll61
  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt6577-clk.h>
    clock-controller@c1000000 {
        compatible = "mediatek,mt6577-pericfg";
        reg = <0xc1000000 0x1000>;
        clocks = <&infracfg CLK_MT6577_AXI>, <&clk26m>,
                 <&apmixedsys CLK_MT6577_WPLL197>,
                 <&apmixedsys CLK_MT6577_WPLL61>;
        clock-names = "axi", "clk26m", "wpll197", "wpll61";
        #clock-cells = <1>;
    };
