%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/brcm,bcm2153-sdio-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM2153 SDIO clock

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  The SDIO clock block contains a dedicated output gate and divider.
  Firmware must retain the nominal 52 MHz effective input. This block
  controls neither that input's initialization nor its upstream ancestry.

properties:
  compatible:
    const: brcm,bcm2153-sdio-clock

  reg:
    maxItems: 1

  '#clock-cells':
    const: 0

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@8140038 {
        compatible = "brcm,bcm2153-sdio-clock";
        reg = <0x08140038 0x8>;
        #clock-cells = <0>;
    };
