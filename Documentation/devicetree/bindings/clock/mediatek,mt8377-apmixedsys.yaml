%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt8377-apmixedsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8377 analog clock controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description:
  The analog clock controller provides MAINPLL, nominal WPLL197MHz and
  WPLL61MHz outputs, and UPLL enable control with an unknown output rate.
  PLL rate programming is not supported. Firmware configuration is retained;
  shared firmware consumers require these outputs to remain on.

properties:
  compatible:
    enum:
      - mediatek,mt8377-apmixedsys
      - mediatek,mt6577-apmixedsys
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    items:
      - const: clk26m
  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@c0007000 {
        compatible = "mediatek,mt8377-apmixedsys";
        reg = <0xc0007000 0x1000>;
        clocks = <&clk26m>;
        clock-names = "clk26m";
        #clock-cells = <1>;
    };
