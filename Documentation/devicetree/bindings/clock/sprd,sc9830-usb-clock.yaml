%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,sc9830-usb-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 USB module gate for RAM bring-up

maintainers:
  - minorum <mit.mis@gmail.com>

description:
  Temporary representation of AP AHB enable bit 4. The parent clock tree
  remains firmware-initialized during the RAM boot experiment.

properties:
  compatible:
    const: sprd,sc9830-usb-clock

  reg:
    maxItems: 1

  '#clock-cells':
    const: 0

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false
