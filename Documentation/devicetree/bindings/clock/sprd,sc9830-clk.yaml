%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,sc9830-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 always-on peripheral gates

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    const: sprd,sc9830-aon-gate

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@402e0000 {
        compatible = "sprd,sc9830-aon-gate";
        reg = <0x402e0000 0x3000>;
        #clock-cells = <1>;
    };
