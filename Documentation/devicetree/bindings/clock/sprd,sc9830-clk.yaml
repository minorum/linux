%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,sc9830-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC9830 clock controllers

maintainers:
  - minorum <mit.mis@gmail.com>

properties:
  compatible:
    oneOf:
      - enum:
          - sprd,sc9830-aon-gate
          - sprd,sc9830-aon-clk
          - sprd,sc9830-aon-mux-clk
          - sprd,sc9830-ap-clk
          - sprd,sc9830-apapb-gate
          - sprd,sc9830-apahb-gate
      - items:
          - const: sprd,sc9830-aon-clk
          - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  '#reset-cells':
    description: AP AHB reset bit index; bit 14 resets the eMMC host.
    const: 1

  clocks:
    minItems: 1
    maxItems: 8

  clock-names:
    minItems: 1
    maxItems: 8

allOf:
  - if:
      properties:
        compatible:
          not:
            contains:
              const: sprd,sc9830-apahb-gate
    then:
      properties:
        '#reset-cells': false
  - if:
      properties:
        compatible:
          contains:
            const: sprd,sc9830-aon-clk
    then:
      properties:
        clocks:
          minItems: 2
          maxItems: 6
        clock-names:
          minItems: 2
          items:
            - const: ext-26m
            - const: ext-32k
            - const: ext-26m-rf1
            - const: ext-4m
            - const: dpll-42m
            - const: mpll-56m
      required:
        - clocks
        - clock-names
  - if:
      properties:
        compatible:
          const: sprd,sc9830-aon-mux-clk
    then:
      properties:
        clocks:
          minItems: 8
          maxItems: 8
        clock-names:
          items:
            - const: ext-26m
            - const: twpll-192m
            - const: twpll-307m2
            - const: twpll-384m
            - const: twpll-512m
            - const: twpll-614m4
            - const: twpll-768m
            - const: dpll
      required:
        - clocks
        - clock-names
  - if:
      properties:
        compatible:
          const: sprd,sc9830-ap-clk
    then:
      properties:
        clocks:
          minItems: 4
          maxItems: 8
        clock-names:
          minItems: 4
          items:
            - const: ext-26m
            - const: twpll-48m
            - const: twpll-51m2
            - const: twpll-153m6
            - const: twpll-256m
            - const: twpll-307m2
            - const: twpll-384m
            - const: twpll-96m
      required:
        - clocks
        - clock-names
  - if:
      properties:
        compatible:
          const: sprd,sc9830-apapb-gate
    then:
      properties:
        clocks:
          minItems: 1
          maxItems: 2
        clock-names:
          minItems: 1
          items:
            - const: i2c2
            - const: uart0
      required:
        - clocks
        - clock-names
  - if:
      properties:
        compatible:
          const: sprd,sc9830-apahb-gate
    then:
      properties:
        clocks:
          minItems: 1
          maxItems: 4
        clock-names:
          minItems: 1
          items:
            - const: sdio0
            - const: sdio1
            - const: emmc
            - const: ext-26m
      required:
        - clocks
        - clock-names
  - if:
      properties:
        compatible:
          const: sprd,sc9830-aon-gate
    then:
      properties:
        clocks: false
        clock-names: false

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@402e0000 {
        compatible = "sprd,sc9830-aon-gate";
        reg = <0x402e0000 0x3000>;
        #clock-cells = <1>;
    };
