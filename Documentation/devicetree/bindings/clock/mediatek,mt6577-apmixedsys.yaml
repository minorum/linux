%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6577-apmixedsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6577 analog clock controller

maintainers:
  - Michal Andrzejczak <mit.mis@gmail.com>

description: The analog clock controller provides MAINPLL.

properties:
  compatible:
    const: mediatek,mt6577-apmixedsys
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    items:
      - const: clk26m
  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@c0007000 {
        compatible = "mediatek,mt6577-apmixedsys";
        reg = <0xc0007000 0x1000>;
        clocks = <&clk26m>;
        clock-names = "clk26m";
        #clock-cells = <1>;
    };
